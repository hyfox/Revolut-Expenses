name: Build Windows EXE

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller Main.spec
          dir dist/RevolutExpenses

      - name: Zip the build
        run: Compress-Archive -Path dist/RevolutExpenses -DestinationPath RevolutExpenses-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevolutExpenses-windows
          path: RevolutExpenses-windows.zip

      - name: Upload zip to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RevolutExpenses-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
